[package]
name = "lemonaid"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "An HTTP client for the Citra Space API, generated from the OpenAPI spec at build time."
readme = "README.md"
repository = "https://github.com/citra-space/lemonaid_rust"
include = [
    "src/**/*.rs",
    "build.rs",
    "openapi/citra.json",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
]

[dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["serde", "v4"] }
futures = "0.3"
bytes = "1"
progenitor-client = "0.14"
regress = "0.10"

[build-dependencies]
progenitor = { version = "0.14", default-features = false }
openapiv3 = "2"
serde_json = "1"
prettyplease = "0.2"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
